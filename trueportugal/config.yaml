# Темы для отбора новостей в @trueportugal («Португалия без розовых очков»).
# ЧЕРНОВИК по последним постам канала — поправь под себя.
#
# description — главное: по ней Claude решает, брать новость или нет.
# keywords — запасной вариант на случай, если ключ API не задан.

audience: >
  «Португалия без розовых очков» — личный канал русскоязычной жительницы Португалии
  (12 лет в стране): жизнь, новости, места, еда, язык. Читатели — русскоязычные жители
  и те, кто думает о переезде. Нужны новости, о которых интересно и полезно рассказать
  от первого лица: что изменится в жизни, сколько стоит, куда поехать, что посмотреть,
  чем удивляет Португалия. Сухие политические и криминальные новости публикуются в другом
  канале (@ExpressPT), здесь их не брать.

topics:
  - name: Деньги и жильё
    description: >
      цены на жильё и аренду, рейтинги рынка недвижимости, ставки, налоги, зарплаты, цены
      в магазинах — когда это касается каждого и про это можно понятно рассказать
    keywords: [habitacao, rendas, arrendamento, imobiliario, casas, precos, juros, euribor, irs,
               salario minimo, impostos]

  - name: Дороги, транспорт и автомобили
    description: >
      новые правила для водителей, платные дороги и сборы, штрафы, бензин, общественный
      транспорт и проездные, аэропорты; автомобили, которые продаются или производятся
      в Португалии, заметные новинки рынка
    keywords: [portagens, condutores, codigo da estrada, multas, combustiveis, gasolina, passe,
               metro, comboios, aeroporto, autoeuropa, carro mais vendido]

  - name: Куда сходить и что посмотреть
    description: >
      музеи и памятники (цены, бесплатные дни, открытие после ремонта), фестивали, события,
      новые интересные места, пляжи, природные явления (волны в Назаре, затмения, звездопады),
      поездки по Португалии, местная еда и праздники
    keywords: [museu, festival, gratuito, entrada gratis, reabre, nazare, praia, eclipse,
               feriado, mercado, restaurante, miradouro]

  - name: Португалия в мире
    description: >
      рейтинги и рекорды, где упоминается Португалия или Лиссабон (лучший город, самый
      счастливый, самый дорогой), «сделано в Португалии», португальцы, о которых говорят
    keywords: [ranking, melhor destino, recorde, feito em portugal, lisboa e o, portugal e o]

  - name: Погода и природа
    description: >
      предупреждения IPMA, шторма и их имена, жара, первые холода, необычные погодные и
      природные явления в Португалии, то, что стоит знать перед выходными
    keywords: [ipma, aviso, tempestade, onda de calor, chuva, frio, sismo, ondas gigantes]

  - name: Правила и документы
    description: >
      новые законы и правила, которые меняют повседневную жизнь жителей и иммигрантов:
      AIMA, ВНЖ, гражданство, SNS, школы — только с понятным практическим смыслом
    keywords: [aima, nacionalidade, autorizacao de residencia, nova lei, sns, escolas]

exclude:
  description: >
    политика без практических последствий, криминальная хроника и происшествия — пожары, ДТП,
    спасения, несчастные случаи (кроме событий, которые затрагивают многих людей), спорт (кроме исторических событий), шоу-бизнес и светская хроника, курьёзы и
    новости о других странах без связи с Португалией, наука и космос без связи с Португалией
  keywords: [benfica, sporting, fc porto, liga betclic, horoscopo, novela, big brother]
