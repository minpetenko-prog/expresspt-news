name: ExpressPT news

on:
  schedule:
    - cron: "7,37 * * * *"   # каждые 30 минут (UTC); GitHub может задерживать запуск на 5–15 минут
  workflow_dispatch: {}       # ручной запуск кнопкой Run workflow

permissions:
  contents: write             # чтобы сохранять состояние в папку state/

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TP_CHAT: ${{ secrets.TRUEPORTUGAL_CHAT_ID }}   # пока секрета нет, шаг @trueportugal пропускается
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: "@ExpressPT — собрать и отправить новости"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m newsbot

      - name: "@trueportugal — собрать и отправить новости"
        if: ${{ !cancelled() && env.TP_CHAT != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TRUEPORTUGAL_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >
          python -m newsbot
          --config trueportugal/config.yaml
          --topics trueportugal/topics.yaml
          --instructions trueportugal/INSTRUCTIONS.md
          --state state/trueportugal.json

      - name: Сохранить состояние
        if: ${{ !cancelled() }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "state: $(date -u +%FT%H:%M)" && git pull --rebase && git push)
