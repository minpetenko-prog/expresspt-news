name: ExpressPT news

# Как запускается: каждый запуск в конце ждёт следующего «слота» (:13 или :43 UTC)
# и сам запускает следующий. Расписание GitHub (schedule) — запасной вариант:
# если цепочка оборвётся, оно её перезапустит. Вручную — кнопка Run workflow.
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write             # чтобы сохранять состояние в папку state/
  actions: write              # чтобы запускать следующий запуск

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TP_CHAT: ${{ secrets.TRUEPORTUGAL_CHAT_ID }}   # пока секрета нет, шаг @trueportugal пропускается
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: "@ExpressPT — собрать и отправить новости"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m newsbot

      - name: "@trueportugal — собрать и отправить новости"
        if: ${{ !cancelled() && env.TP_CHAT != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TRUEPORTUGAL_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >
          python -m newsbot
          --config trueportugal/config.yaml
          --topics trueportugal/topics.yaml
          --instructions trueportugal/INSTRUCTIONS.md
          --state state/trueportugal.json

      - name: Сохранить состояние
        if: ${{ !cancelled() }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "state: $(date -u +%FT%H:%M)" && git pull --rebase && git push)

      - name: Дождаться следующего запуска и запустить его
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          m=$(date -u +%-M); s=$(date -u +%-S)
          if [ "$m" -lt 13 ]; then t=13; elif [ "$m" -lt 43 ]; then t=43; else t=73; fi
          wait=$(( (t - m) * 60 - s )); [ "$wait" -lt 1 ] && wait=1
          echo "Следующий запуск через $wait с"
          sleep "$wait"
          # Ставим следующий запуск всегда. Дублей не будет: группа concurrency «news»
          # держит не больше одного ожидающего запуска, лишний GitHub отменит сам.
          for attempt in 1 2 3; do
            gh workflow run news.yml -R "${{ github.repository }}" --ref main && { echo "Следующий запуск поставлен"; break; }
            echo "Не удалось поставить запуск (попытка $attempt), повтор через 20 с"; sleep 20
          done
