# Настройки парсера новостей для @ExpressPT

settings:
  # Новости старше этого возраста не берём (по дате из ленты)
  max_age_hours: 12
  # Сколько готовых постов максимум присылать за один запуск (раз в 30 минут)
  max_posts_per_run: 5
  # Подпись в конце каждого поста
  signature: "@ExpressPT 🇵🇹"
  # Показывать превью ссылки на источник под постом (как в канале)
  link_preview: true
  # Модели Claude (используются, только если задан ANTHROPIC_API_KEY)
  select_model: claude-haiku-4-5-20251001   # отбор новостей — дешёвая модель
  write_model: claude-sonnet-5-5            # переписывание — модель посильнее
  # Сколько запусков подряд источник может падать, прежде чем бот предупредит в чат
  alert_after_failures: 6

# Источники. type: rss | publico_json | html
# Для html: link_pattern — регулярное выражение для ссылок на статьи.
# fallback — запасные способы, если основной не сработал.
# user_agent — представиться программой для чтения RSS: некоторые сайты пускают
# такие запросы, а обычный «браузер» с серверного адреса блокируют.
sources:
  - id: eco
    name: ECO
    type: rss
    url: https://eco.sapo.pt/feed/

  - id: observador
    name: Observador
    type: rss
    url: https://observador.pt/feed/

  - id: dn
    name: Diário de Notícias
    type: rss
    url: https://www.dn.pt/feed

  - id: rtp
    name: RTP Notícias
    type: rss
    url: https://www.rtp.pt/noticias/rss

  - id: lusa
    name: Lusa
    type: html
    url: https://www.lusa.pt/
    link_pattern: 'lusa\.pt/article/\d+/'

  - id: publico
    name: Público
    type: publico_json
    url: https://www.publico.pt/api/list/ultimas
    fallback:
      - type: rss
        url: https://feeds.feedburner.com/PublicoRSS

  - id: publico_brasil
    name: Público Brasil
    type: publico_json
    url: https://www.publico.pt/api/list/publico-brasil

  - id: sic
    name: SIC Notícias
    type: rss
    url: https://feeds.feedburner.com/sicnoticias-ultimas
    fallback:
      - type: rss
        url: https://sicnoticias.pt/rss

  - id: negocios
    name: Jornal de Negócios
    type: rss
    url: https://www.jornaldenegocios.pt/rss

  - id: sapo
    name: SAPO
    type: rss
    url: https://www.sapo.pt/feed
    fallback:
      - type: html
        url: https://www.sapo.pt/noticias/atualidade
        link_pattern: 'sapo\.pt/.+/artigos/'

  - id: idealista
    name: idealista/news
    type: rss
    url: https://www.idealista.pt/news/rss/v2/latest-news.xml
    fallback:
      - type: rss
        url: https://www.idealista.pt/news/rss/v2/latest-news.xml
        user_agent: "Feedly/1.0 (+http://www.feedly.com/fetcher.html; like FeedFetcher-Google)"
      - type: rss
        url: https://www.idealista.pt/news/rss/v2/latest-news.xml
        user_agent: "FeedFetcher-Google; (+http://www.google.com/feedfetcher.html)"
      - type: html
        url: https://www.idealista.pt/news/
        link_pattern: 'idealista\.pt/news/[a-z0-9/-]+/\d{4}/\d{2}/\d{2}/'

  - id: noticiasaominuto
    name: Notícias ao Minuto
    type: rss
    url: https://www.noticiasaominuto.com/rss/ultima-hora
    fallback:
      - type: html
        url: https://www.noticiasaominuto.com/
        link_pattern: 'noticiasaominuto\.com/[a-z-]+/\d+/'

  - id: expresso
    name: Expresso
    type: rss
    url: https://expresso.pt/rss
    fallback:
      - type: rss
        url: https://expresso.pt/rss
        user_agent: "Feedly/1.0 (+http://www.feedly.com/fetcher.html; like FeedFetcher-Google)"
      - type: rss
        url: https://feeds.feedburner.com/expresso-geral

  - id: tempo
    name: tempo.pt
    type: html
    url: https://www.tempo.pt/
    link_pattern: 'tempo\.pt/noticias/[a-z0-9-]+/[a-z0-9-]+\.html'

  - id: nit
    name: NiT
    type: rss
    url: https://www.nit.pt/feed

  - id: cmjornal
    name: Correio da Manhã
    type: rss
    url: https://www.cmjornal.pt/rss
    fallback:
      - type: html
        url: https://www.cmjornal.pt/ultima-hora
        link_pattern: 'cmjornal\.pt/[a-z-]+/(?:[a-z-]+/)?detalhe/'
