# Темы для отбора новостей в @ExpressPT.
#
# description — главное: по ней Claude решает, брать новость или нет.
# keywords — запасной вариант на случай, если ключ API не задан (поиск слов в заголовке).

audience: >
  Редактор канала и его читатели — русскоязычные иммигранты, которые живут в Португалии.
  Новость берём, только если она практически полезна или по-настоящему важна для жизни
  в стране: деньги, документы, безопасность, быт. В первую очередь — то, что пригодится
  самому редактору. Любопытное «для общего развития» не берём.

topics:
  - name: Финансы и экономика
    description: >
      только то, что влияет на кошелёк жителя Португалии: ставки по вкладам и ипотеке,
      Euribor, цены на продукты, бензин, электричество, газ, аренду и жильё; налоги (IRS, IVA),
      зарплаты, минимальная зарплата, пенсии, пособия; место Португалии в рейтингах ЕС
      (зарплаты, цены, доходы, рост экономики); решения, которые меняют цены и тарифы.
      НЕ брать: биржевые котировки, отчёты и сделки отдельных компаний, назначения
      руководителей, макроэкономику без понятных последствий для людей
    keywords: [juros, euribor, credito a habitacao, depositos, precos, inflacao, cabaz, combustiveis,
               gasolina, gasoleo, eletricidade, rendas, arrendamento, habitacao, irs, iva, impostos,
               salario minimo, salarios, pensoes, subsidio, seguranca social, eurostat]

  - name: Иммиграция и политика
    description: >
      всё, что касается иностранцев и иммигрантов: AIMA, ВНЖ и их продление, визы, гражданство
      и закон о гражданстве, воссоединение семей, золотые визы, обмен водительских прав,
      налоговые режимы для новых резидентов (IFICI, бывший NHR), документы в Finanças, SNS,
      Segurança Social. Из политики — только решения правительства и парламента, которые прямо
      меняют жизнь жителей: новые законы и правила, бюджет, итоги выборов.
      НЕ брать: партийные споры, заявления политиков без последствий, международную политику
      без связи с Португалией
    keywords: [aima, imigrantes, imigracao, estrangeiros, nacionalidade, autorizacao de residencia,
               vistos, visto gold, reagrupamento familiar, cplp, ifici, nhr, governo aprova,
               conselho de ministros, parlamento aprova, orcamento do estado, eleicoes, nova lei]

  - name: Общество
    description: >
      события, которые заметят жители: забастовки и сбои транспорта (CP, Metro, Carris, TAP,
      аэропорты), работа SNS, больниц и скорой помощи, школы, новые правила для водителей и
      жителей, заметные изменения в Лиссабоне, Порту и Алгарве, крупные события в стране.
      НЕ брать: истории про животных, курьёзы, светскую хронику, культуру и шоу-бизнес, спорт,
      местные новости маленьких посёлков
    keywords: [greve, comboios, metro, carris, aeroporto, tap, sns, hospitais, urgencias, inem,
               medicos de familia, escolas, portagens, passe, codigo da estrada]

  - name: Происшествия и криминал
    description: >
      заметные происшествия и преступления в Португалии: мошеннические схемы (особенно против
      жителей и иностранцев), задержания, ограбления, нападения в Лиссабоне, Порту, Алгарве и
      туристических местах, крупные ДТП и пожары.
      НЕ брать: мелкие бытовые случаи в провинции, судебную хронику без новых фактов
    keywords: [burla, fraude, detido, detidos, assalto, roubo, esfaqueado, psp, gnr,
               policia judiciaria, homicidio, incendio, incendios]

  - name: Погодные предупреждения
    description: >
      предупреждения IPMA жёлтого, оранжевого и красного уровня, жара, шторма, ливни, сильный
      ветер, пожароопасность, землетрясения, а также последствия непогоды (закрытые дороги,
      отменённые поезда и рейсы)
    keywords: [ipma, aviso amarelo, aviso laranja, aviso vermelho, onda de calor, tempestade,
               depressao, chuva forte, risco de incendio, sismo]

# Что пропускать всегда
exclude:
  description: >
    животные и природа без последствий для людей (вроде дельфинов у берега), курьёзы,
    светская хроника, шоу-бизнес, сериалы, спорт, гороскопы, рецепты, колонки мнений,
    международные новости без связи с Португалией
  keywords: [benfica, sporting, fc porto, futebol, horoscopo, receita, novela, telenovela,
             big brother, golfinho, golfinhos]
